name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t log-intrusion-detector .

      - name: Detector must catch the break-in hidden in the sample log
        run: |
          set +e
          docker run --rm log-intrusion-detector sample_logs/auth.log --year 2026 --fail-on-critical
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 (CRITICAL alert found), got $code"
            exit 1
          fi
          echo "CRITICAL alert detected as expected."
